[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=3
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev

[env:esp32-c3-devkitm-1]
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
build_flags =
  -std=c++17
  -Wall
  -Wextra
lib_deps =
build_src_filter =
  +<protocols/>
  -<*>
test_build_src = true
